[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xalgv"
version = "0.1.0"
description = "Local autonomous computer-using agent with dynamic planning, tool execution, and browser automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
sandbox = [
    "playwright>=1.49",
    "Pillow>=10.0",
    "tokenizers>=0.21",
]
rag = [
    "lancedb>=0.14",
]

[project.scripts]
xalgv = "local_agent.main:cli_main"

[tool.hatch.build.targets.wheel]
packages = ["local_agent", "eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
